[project]
name = 'beaupy'
version = '4.0.0'
description = 'A library of elements for interactive TUIs in Python'
authors = [{ name = 'Peter Vyboch', email = 'pvyboch1@gmail.com' }]
license = 'MIT'
readme = 'README.md'
keywords = ["cli", "interactive", "console", "terminal", "interface"]
classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Development Status :: 5 - Production/Stable',
    'Topic :: Terminals',
    'Environment :: Console',
    'Intended Audience :: Developers'
]
requires-python = ">=3.8,<4.0.0"
dependencies = [
    "rich>=12.2.0",
    "emoji>=2.0.0,<3.0.0",
    "python-yakh>=0.4.2,<0.5.0",
    "questo>=0.4.1,<0.5.0",
]

[project.urls]
Repository = 'https://github.com/petereon/beaupy'

[tool.uv]
# dev's watchdog==6.0.0 (local file-watch tasks) and docs' novella (needs watchdog<3.0.0)
# are never installed together, so let uv resolve each independently.
conflicts = [[{ group = "dev" }, { group = "docs" }]]

[tool.uv.build-backend]
# Flat layout (beaupy/ at repo root), not the src/ layout uv_build defaults to.
module-root = ""

[dependency-groups]
# pytest/mypy themselves need Python >=3.10, though the published package supports >=3.8 (dev
# tooling is only ever installed/run on the Python versions CI actually lints and tests with).
dev = [
    "poethepoet==0.31.1; python_version >= '3.10'",
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-cov==7.1.0; python_version >= '3.10'",
    "mypy==2.2.0; python_version >= '3.10'",
    "ruff==0.14.5; python_version >= '3.10'",
    "watchdog==6.0.0; python_version >= '3.10'",
    "types-emoji==2.1.0.3; python_version >= '3.10'",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "novella==0.2.6",
    "pydoc-markdown==4.8.2",
    # novella's nr.util.plugins uses the deprecated pkg_resources API without declaring
    # setuptools itself; uv's venvs don't bundle it the way pip/poetry's historically did.
    # setuptools>=81 dropped pkg_resources entirely, so pin below that.
    "setuptools<81",
]

[tool.poe]
verbosity = -1

[tool.poe.tasks]
add = { shell = 'uv add' }
install = { shell = 'uv sync' }
build = { shell = 'uv build' }
clean = { shell = 'rm -R ./dist .pytest_cache .mypy_cache &> /dev/null' }
format = { shell = 'uv run ruff format ./beaupy' }
lint = { shell = 'uv run ruff check ./beaupy' }
mypy = { shell = 'uv run mypy ./beaupy/' }
check = { shell = 'echo "Running ruff format..." ; uv run poe format ; echo "Running ruff check..." ; uv run poe lint ; echo "Running mypy..." ; uv run poe mypy ; echo Done!' }
"check:watch" = { shell = "uv run poe check ; uv run watchmedo shell-command --patterns='*.py;*.feature;*.toml' --recursive --drop --command='uv run poe check'" }
"test" = { shell = "uv run pytest --cov=beaupy --cov-report xml:coverage.xml --cov-report term" }
"test:watch" = { shell = "uv run poe test; uv run watchmedo shell-command --patterns='*.py;*.feature;*.toml' --recursive --drop --command='uv run poe test'" }

[tool.mypy]
files = ["beaupy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
show_column_numbers = true
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py38"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "C90", "SIM", "PIE", "S", "T20", "ERA", "PERF", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 19

[[tool.pydoc-markdown.loaders]]
type = 'python'
search_path = ['./beaupy']

[tool.pydoc-markdown.renderer]
type = 'markdown'
render_toc = true

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
