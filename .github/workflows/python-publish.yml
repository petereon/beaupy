
# This workflow will upload a Python Package using uv when a release is created
# For more information see: https://docs.astral.sh/uv/guides/publish/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: uv sync --group dev
    - name: Build the library
      run: uv build
    - name: Test with pytest
      run: uv run poe test

    - name: Install documentation dependencies
      # pydoc-markdown's legacy pkg_resources-based plugin loader can't see uv's dist-info
      # metadata for dotted distribution names (e.g. databind.json), so use uv's pip-compatible
      # installer here instead of `uv sync`.
      run: uv pip install --group docs .
    - name: Build documentation
      run: cd docs && uv run --no-sync novella
    - name: Publish documentation
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
      with:
        branch: gh-pages
        folder: docs/_site
        ssh-key: ${{ secrets.DEPLOY_KEY }}

    - name: Publish package
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
